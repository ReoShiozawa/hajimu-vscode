name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:assets
      - run: npm run package
      - run: npm audit --audit-level=high
      - name: Sign build provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/release-integrity
        with:
          subject-path: "*.vsix"
          artifact-name: sbom-vsix
    permissions:
      contents: read
      id-token: write
      attestations: write
